name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # The "GitHub PRs" stat on /projects is fetched at build time, so it only
  # refreshes when the site is rebuilt -- without this it silently drifts
  # behind between pushes. An off-peak minute on purpose: GitHub's cron queue
  # backs up 30-60 minutes at :00 and can drop runs entirely under load.
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

# Every job narrows this further for itself; the shared floor is read-only.
permissions:
  contents: read

concurrency:
  group: pages
  # Queue rather than cancel. This was written when `push` was the only
  # trigger; with the cron added, cancelling would let the nightly run kill a
  # push deploy mid-publish and skip its smoke check.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Narrower than the workflow-level block on purpose: `pnpm build` runs
    # every dependency's build-time code with this token, and dependency
    # updates merge themselves -- so it must not carry pages:write (publish an
    # arbitrary deployment) or issues:write (post as the repo).
    permissions:
      contents: read
    outputs:
      # Consumed by `smoke` to prove the live site serves THIS build. It has to
      # be an output rather than something smoke recomputes from its own env:
      # "Re-run failed jobs" bumps GITHUB_RUN_ATTEMPT run-wide but does NOT
      # re-run this job or redeploy, so a recomputed id would demand a build
      # that was never published and fail on every retry forever. Outputs of a
      # job that was not re-run are preserved, so this stays truthful.
      build-id: ${{ steps.build-id.outputs.value }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Derive a build id
        id: build-id
        run: echo "value=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Build Astro site
        run: pnpm build
        env:
          SITE: https://kadkhodaei.de
          # Baked into /build-info.json for the smoke check to match on.
          BUILD_ID: ${{ steps.build-id.outputs.value }}
          # src/pages/projects.astro queries the GitHub search API for the
          # merged-PR count. Unauthenticated search allows 10 requests per
          # minute per IP -- and a hosted runner's IP is shared with every
          # other Actions job on it, so an unauthenticated build can be rate
          # limited through no fault of its own and fall back to a stale
          # number. The default token raises this to 30/minute.
          #
          # Issue search returns what the *caller* can see, not merely public
          # repositories -- the same query run against a user PAT returns 536
          # where an unauthenticated one returns 489, the difference being
          # merged PRs in private repos. The query itself pins `is:public` so
          # the published figure stays caller-independent if this is ever
          # swapped for a broader token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The only job that publishes. No checkout, so it does not need contents.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  smoke:
    # Last line of defence. Dependency updates merge themselves once the
    # pre-merge gate is green, so this is what catches anything the gate does
    # not assert -- a broken asset path, a CDN-level failure, a build that
    # succeeds but produces a dead site.
    name: Post-deploy smoke check
    needs: [build, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Verify the live site
        env:
          # Taken from the build job, never recomputed here -- see that job's
          # `outputs` block for why that distinction is load-bearing.
          WANT: ${{ needs.build.outputs.build-id }}
        run: |
          set -euo pipefail
          SITE='https://kadkhodaei.de'

          # Wait for the NEW build, not merely for a 200. During the Pages
          # propagation window the previous deployment still answers 200 with a
          # valid title and working CSS, so polling for a 200 would happily
          # smoke-test the old site and report green while the just-deployed
          # one is broken -- the exact failure this job exists to catch.
          # /build-info.json carries the id of the build that produced it.
          # Match on that rather than the commit: a scheduled run rebuilds the
          # SHA the live site already serves, and so does "re-run all jobs" --
          # either would match on the first poll against the *old* deployment
          # and smoke-test nothing.
          #
          # There is no cache-busting to be had here, despite what earlier
          # revisions of this loop assumed. Pages serves build-info.json with
          # max-age=600 and its CDN does not key on the query string: five
          # distinct ?ts= values return the same object, at the same age, from
          # five different edge nodes, and no-cache request headers are ignored
          # too. Only a distinct *path* misses. So the poll cannot force a
          # fresh read -- it can only outlast the TTL, which is why the window
          # below is deliberately longer than 600s rather than the ~150s that
          # a bustable cache would have justified. It costs nothing when the
          # deployment lands promptly, since the loop breaks on the first match.
          #
          # An empty WANT would match an old build-info.json that predates the
          # `run` key (jq prints "" for both), turning the whole job green
          # while proving nothing -- the failure mode this job exists to resist.
          [ -n "$WANT" ] || { echo '::error::build id never arrived from the build job'; exit 1; }

          MAX_ATTEMPTS=45
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            LIVE_RUN="$(curl -fsS --max-time 20 "$SITE/build-info.json" \
              | jq -r '.run // empty' || true)"
            if [ "$LIVE_RUN" = "$WANT" ]; then
              echo "Live site is serving run $WANT ($GITHUB_SHA)."
              break
            fi
            if [ "$attempt" = "$MAX_ATTEMPTS" ]; then
              echo "::error::$SITE never served run $WANT (last seen: ${LIVE_RUN:-no response})"
              exit 1
            fi
            echo "attempt $attempt/$MAX_ATTEMPTS: serving run ${LIVE_RUN:-no response}, waiting for $WANT"
            sleep 15
          done

          curl -fsS --max-time 20 "$SITE" -o /tmp/live.html \
            || { echo "::error::$SITE did not return 200"; exit 1; }

          # A 200 alone is not proof the site works: Pages will happily serve a
          # 404 page or an empty shell. Assert content that only a real build
          # produces.
          grep -q '<title>' /tmp/live.html \
            || { echo '::error::no <title> in the served HTML'; exit 1; }
          grep -qi 'kadkhodaei' /tmp/live.html \
            || { echo '::error::served HTML does not look like the portfolio'; exit 1; }

          # Styling is the thing the pre-merge visual suite guards; here just
          # confirm a stylesheet is actually referenced and fetchable, which
          # catches asset-path breakage from a bundler upgrade.
          CSS_PATH="$(grep -o 'href="[^"]*\.css"' /tmp/live.html | head -1 | cut -d'"' -f2)"
          if [ -z "$CSS_PATH" ]; then
            echo '::error::no stylesheet referenced in the served HTML'
            exit 1
          fi
          case "$CSS_PATH" in
            http*) CSS_URL="$CSS_PATH" ;;
            *)     CSS_URL="$SITE$CSS_PATH" ;;
          esac
          curl -fsS --max-time 20 "$CSS_URL" -o /dev/null \
            || { echo "::error::stylesheet $CSS_URL is not fetchable"; exit 1; }

          echo "Live site OK: title present, content matches, CSS at $CSS_PATH loads."

      - name: Open an issue if the live site is broken
        if: failure()
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9.0.0
        with:
          script: |
            // A scheduled rebuild deploys a commit that was already live and
            // healthy, so the push-path advice below ("revert the offending
            // commit") would revert an unrelated healthy change.
            const scheduled = context.eventName === 'schedule';
            const sha = context.sha.slice(0, 7);
            const title = scheduled
              ? 'Live site smoke check failed on a scheduled rebuild'
              : `Live site smoke check failed after deploying ${sha}`;
            // Reuse one open issue rather than filing a new one per failed
            // deploy, so a sustained outage does not bury the inbox.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'deploy-failure',
            });
            const body = [
              scheduled
                ? `The nightly rebuild of ${context.sha} failed its smoke check. That commit was already live and healthy before this run.`
                : `The post-deploy smoke check failed for commit ${context.sha}.`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              ...(scheduled
                ? [
                    'Nothing was merged, so there is no commit to revert. Look at',
                    'Pages propagation or the GitHub search API rather than the diff.',
                  ]
                : [
                    'Dependency updates merge themselves, so this may be an upgrade',
                    'that passed the pre-merge gate. To roll back, revert the offending',
                    'commit on `main` — the deploy workflow will republish.',
                  ]),
            ].join('\n');
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['deploy-failure'],
              });
            }
