name: Preview on Cloudflare Pages

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.*'
      - 'tailwind.config.*'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read
  pull-requests: write
  deployments: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          # A pull_request run can read main's cache but only write its own PR
          # scope, so a PR cannot poison what later runs restore; and this job
          # only publishes pr-N preview branches, never production.
          cache: 'pnpm' # zizmor: ignore[cache-poisoning]

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Astro site
        run: pnpm build
        env:
          SITE: https://pr-${{ github.event.pull_request.number }}.kadkhodaei.pages.dev

      # Previews live in the production project `kadkhodaei` as `pr-N` branches:
      # only `main` is its production branch, so these never replace the live
      # site, and Pages marks them noindex.
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: pnpm
          command: pages deploy dist/ --project-name=kadkhodaei --branch=pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: cloudflare-preview
          message: |
            ## Cloudflare Pages Preview

            | Status | URL |
            |--------|-----|
            | ✅ Deployed | ${{ steps.deploy.outputs.pages-deployment-alias-url }} |

            _Updated on push to `${{ github.head_ref }}`_
