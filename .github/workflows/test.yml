name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Neither `astro build` nor vitest typechecks -- both transpile and throw
      # the types away. Without this, a `@types/react` or `typescript` bump
      # merges itself green while the project no longer compiles, which matters
      # more now that those land unattended. Runs before the build so a type
      # error is reported as a type error rather than a build failure.
      - name: Typecheck
        run: pnpm exec astro check

      - name: Build site
        run: pnpm build
        env:
          SITE: https://kadkhodaei.de

  unit:
    name: Unit & Component Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit & component tests
        run: pnpm test:unit

  python:
    name: Python Script Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        run: uv pip install --system -r requirements-dev.txt

      - name: Lint
        run: ruff check scripts/ tests/python/

      - name: Run script tests
        run: pytest tests/python -q

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # No explicit build step: playwright.config.ts webServer runs
      # `pnpm build && pnpm preview`, and reuseExistingServer is off in CI,
      # so building here would just do the same work twice. The dedicated
      # `build` job above is what reports build breakage.
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          SITE: https://kadkhodaei.de

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run visual regression tests
        run: pnpm test:visual
        env:
          SITE: https://kadkhodaei.de

      - name: Upload visual diff report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  ci-gate:
    # The single required status check. Dependency PRs merge themselves once
    # required checks pass, so the set of required checks IS the safety gate --
    # and naming each job in branch protection means every new or renamed job
    # silently widens the hole (which is exactly how Build, Python Script Tests
    # and Visual Regression ended up advisory-only). Requiring only this job
    # keeps the gate correct as jobs come and go: add a job to `needs` and it is
    # enforced immediately, with no branch-protection change.
    name: CI Gate
    needs: [build, unit, python, e2e, visual]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify every gate job succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # `if: always()` means this job runs even when a dependency fails or
          # is cancelled/skipped, so an explicit check is required -- anything
          # other than success must fail the gate.
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result != "success")' > /dev/null; then
            echo '::error::CI gate failed — one or more required jobs did not succeed'
            exit 1
          fi
          echo 'CI gate passed — all required jobs succeeded.'
