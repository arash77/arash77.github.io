name: Monthly Portfolio Update

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.14'

      - name: Set up UV
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt
      
      - name: Fetch recent contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: arash77
          # AI config. AI_MODELS is a simple ordered list of model IDs to try
          # (priority order). AI_PROVIDERS is a JSON array mapping each server to
          # the model IDs it serves, its base URL, and the token env var. Edit
          # either to change providers/models without touching the script. Falls
          # back to built-in defaults if unset.
          AI_PROVIDERS: ${{ vars.AI_PROVIDERS }}
          AI_MODELS: ${{ vars.AI_MODELS }}
          AI_LOCAL_TOKEN: ${{ secrets.AI_LOCAL_TOKEN }}
          GEMINI_TOKEN: ${{ secrets.GEMINI_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/fetch_contributions.py

      - name: Fetch recent publications
        run: python scripts/fetch_publications.py
      
      - name: Check for changes
        id: check_changes
        run: |
          # Detect both modified tracked files and new untracked files.
          # `git diff --quiet` alone misses untracked files that the scripts
          # create, which would silently skip the PR step.
          if git diff --quiet src/content/projects/ src/data/conferences.json \
             && ! git ls-files --others --exclude-standard \
                  src/content/projects/ src/data/conferences.json | grep -q .; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      # This PR changes /resume and /projects content, so the committed
      # screenshot baselines no longer match by definition -- the Visual
      # Regression job would fail on changes that are the entire point of the
      # PR. Refresh them here, on ubuntu-latest (the only OS whose font
      # rendering the baselines are valid for), so the PR carries content and
      # baselines together. The visual suite exists to catch *dependency*
      # regressions; a content-only diff is reviewed by reading the PR.
      - name: Set up pnpm
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Set up Node.js
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Node dependencies
        if: steps.check_changes.outputs.has_changes == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        if: steps.check_changes.outputs.has_changes == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Refresh visual baselines for the new content
        if: steps.check_changes.outputs.has_changes == 'true'
        run: pnpm exec playwright test tests/e2e/visual.spec.ts --update-snapshots
        env:
          SITE: https://kadkhodaei.de

      - name: Set date variables
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV
          echo "BRANCH_NAME=monthly-portfolio-$(date +%Y-%m-%d)" >> $GITHUB_ENV

      # A PR opened with the default GITHUB_TOKEN triggers no workflows
      # (GitHub's anti-recursion rule), so it would arrive with zero checks --
      # and against the required CI Gate it could then never merge without
      # someone closing and reopening it. A GitHub App installation token is
      # treated as a distinct actor, so PRs it opens DO run CI.
      #
      # Preferred over a PAT: the token is minted per run and expires in an
      # hour, it is scoped to this repository rather than everything the token
      # owner can reach, and the App's private key does not expire -- a PAT
      # would silently lapse after at most a year and quietly stop the
      # automation this exists to guarantee.
      #
      # Setup: create a GitHub App with Contents + Pull requests (read/write),
      # install it on this repo, then set the PORTFOLIO_APP_CLIENT_ID
      # *variable* and the PORTFOLIO_APP_PRIVATE_KEY *secret*. The Client ID is
      # a variable rather than a secret so it can be tested in the `if:` below
      # -- it is a public identifier, and secrets are not readable in step
      # conditions.
      - name: Mint a GitHub App token
        id: app_token
        if: steps.check_changes.outputs.has_changes == 'true' && vars.PORTFOLIO_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # `client-id`, not the deprecated `app-id` (this pinned version emits
          # a deprecation warning for the latter).
          client-id: ${{ vars.PORTFOLIO_APP_CLIENT_ID }}
          private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          # Falls back to GITHUB_TOKEN when the App is not configured: the PR is
          # still created correctly, it just arrives without checks and needs a
          # close/reopen to start them.
          token: ${{ steps.app_token.outputs.token || secrets.GITHUB_TOKEN }}
          commit-message: "🤖 Update portfolio for month of ${{ env.DATE }}"
          title: "📊 Monthly Portfolio Update"
          body: |
            *This PR was automatically generated by the monthly portfolio update workflow.*

            **Updates included:**
            - 💻 GitHub contributions fetched and summarized via AI
            - 📚 Publications and presentations fetched from ORCID/Crossref
            - 📸 Visual regression baselines refreshed for the new content
          branch: ${{ env.BRANCH_NAME }}
          delete-branch: true
