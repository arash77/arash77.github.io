# Pin the lint rules instead of following ruff's defaults. ruff 0.16 widened its
# default rule set (63 new findings in unchanged code), and on a rarely tended
# repo every such widening would fail CI on a routine dependency update. These
# are the defaults ruff used through 0.14 -- exactly what CI has enforced so far.
# Add rules here deliberately rather than by upgrading ruff.
[lint]
select = ["E4", "E7", "E9", "F"]
